# Advancement score and reward sheet.
#
# Each advancement can give two things, once per island:
#   1. A protection range increase for the island (the "score")
#   2. A reward for the player who completed it: items, experience, money and commands
#
# Advancement keys are the vanilla namespaced key without the "minecraft:" prefix,
# e.g. 'adventure/kill_a_mob'.
#
# An entry may be a plain number (protection range increase only):
#   'adventure/kill_a_mob': 4
#
# ...or a section with a protection-range and/or a rewards block:
#   'end/kill_dragon':
#     protection-range: 2
#     rewards:
#       items:
#       - DIAMOND:5
#       experience: 100
#       money: 100.0
#       commands:
#       - give [player] elytra 1
#
# Reward notes:
# - items use the BentoBox item format, e.g. GOLD_INGOT:1 or POTION:JUMP:2:NOTEXTENDED:SPLASH:1
# - money requires an economy plugin (Vault)
# - commands run from the console; [player] is replaced by the player's name and the
#   [SUDO] prefix makes the command run as the player
#
# Advancements not listed here use the defaults from the settings section below:
# - roots (keys ending in /root) use default-root-increase and default-root-reward
# - recipes use unknown-recipe-increase and default-recipe-reward
# - everything else uses unknown-advancement-increase and unknown-advancement-reward
# An advancement with a score of 0 and no reward is not tracked at all.
settings:
  default-root-increase: 0
  unknown-advancement-increase: 1
  unknown-recipe-increase: 0
  default-root-reward: {}
  default-recipe-reward: {}
  unknown-advancement-reward:
    items:
    - GOLD_INGOT:1
    commands:
    - tellraw [player] {"text":"Have a Gold Bar!","color":"green"}
